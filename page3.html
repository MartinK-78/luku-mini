<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKU — Add Clothes</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-sm py-4">
        <div class="max-w-xl mx-auto px-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black tracking-tight">LUKU Mini</h1>
                <p class="text-indigo-200 text-xs font-medium">Academic MVP Testbed</p>
            </div>
            <div class="bg-indigo-700 text-xs font-bold px-3 py-1.5 rounded-lg border border-indigo-500">
                👤 Tester Profile ID: <span id="testerIdBadge">0</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-xl w-full mx-auto px-4 py-8">
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
            <div class="text-center space-y-1">
                <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Step 3 of 5</span>
                <h2 class="text-xl font-bold text-slate-900">Add Clothes Quickly</h2>
                <p class="text-slate-500 text-xs">Load items into your profile memory vault.</p>
            </div>

            <form onsubmit="addGarment(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Item Description Name</label>
                    <input type="text" id="formItemName" required placeholder="e.g., Slim-fit Blue Jeans" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Garment Type</label>
                        <select id="formItemCategory" class="w-full px-2 py-2 border border-slate-200 rounded-lg bg-white text-sm">
                            <option value="Top">👕 Top</option>
                            <option value="Bottom">👖 Bottom</option>
                            <option value="Shoes">👟 Shoes</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Occasion Tag</label>
                        <select id="formItemOccasion" class="w-full px-2 py-2 border border-slate-200 rounded-lg bg-white text-sm">
                            <option value="Casual">☀️ Casual</option>
                            <option value="Work">💼 Work / Official</option>
                            <option value="Party">🎉 Party / Event</option>
                            <option value="School">🎓 School / Campus</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg text-sm transition-colors shadow-sm">
                    ⚡ Register & Add Item
                </button>
            </form>

            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-center text-xs">
                <span class="text-slate-500 font-medium">Garments saved in this active profile:</span>
                <span id="inputPageCounter" class="font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">0 items</span>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 shadow-xl sticky bottom-0 z-50">
        <div class="max-w-xl mx-auto px-4 flex justify-between items-center">
            <button onclick="window.location.href='page2.html'" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition-all">
                ◀ Back
            </button>
            <button onclick="window.location.href='page4.html'" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all">
                Next ▶
            </button>
        </div>
    </footer>

    <script>
        const activeSlot = localStorage.getItem('luku_active_tester_slot') || "1";
        document.getElementById('testerIdBadge').innerText = activeSlot;
        const storageKey = `luku_tester_storage_slot_${activeSlot}`;

        let wardrobe = JSON.parse(localStorage.getItem(storageKey)) || [];
        updateCounter();

        function addGarment(e) {
            e.preventDefault();
            const inputEl = document.getElementById('formItemName');
            
            const garment = {
                id: Date.now().toString(),
                name: inputEl.value.trim(),
                category: document.getElementById('formItemCategory').value,
                occasion: document.getElementById('formItemOccasion').value,
                isWorn: false,
                isLiked: false
            };

            wardrobe.push(garment);
            localStorage.setItem(storageKey, JSON.stringify(wardrobe));
            
            inputEl.value = '';
            inputEl.focus();
            updateCounter();
            alert("Garment successfully loaded into memory slot!");
        }

        function updateCounter() {
            document.getElementById('inputPageCounter').innerText = `${wardrobe.length} items`;
        }
    </script>
</body>
</html>
