<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKU — Gender Selection</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-sm py-4">
        <div class="max-w-xl mx-auto px-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black tracking-tight">LUKU Mini</h1>
                <p class="text-indigo-200 text-xs font-medium">Academic MVP Testbed</p>
            </div>
            <div class="bg-indigo-700 text-xs font-bold px-3 py-1.5 rounded-lg border border-indigo-500">
                👤 Tester Profile ID: <span id="testerIdBadge">0</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-xl w-full mx-auto px-4 py-8">
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
            <div class="text-center space-y-1">
                <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Step 2 of 5</span>
                <h2 class="text-xl font-bold text-slate-900">Wardrobe Target Gender</h2>
                <p class="text-slate-500 text-xs">Filter your closet view and recommendations.</p>
            </div>

            <div class="grid grid-cols-1 gap-2.5">
                <button onclick="saveGender('All')" id="genderOptAll" class="w-full border-2 border-slate-200 bg-white p-4 rounded-xl text-left font-bold transition-all flex justify-between items-center hover:bg-slate-50">
                    <span>🚻 Mixed / View All Clothes</span>
                    <span class="text-xs font-normal text-slate-400">Default view</span>
                </button>
                <button onclick="saveGender('Male')" id="genderOptMale" class="w-full border-2 border-slate-200 bg-white p-4 rounded-xl text-left font-bold transition-all flex justify-between items-center hover:bg-slate-50">
                    <span>🧑 Male Selection Only</span>
                    <span class="text-xs font-normal text-slate-400">Strictly men's items</span>
                </button>
                <button onclick="saveGender('Female')" id="genderOptFemale" class="w-full border-2 border-slate-200 bg-white p-4 rounded-xl text-left font-bold transition-all flex justify-between items-center hover:bg-slate-50">
                    <span>👩 Female Selection Only</span>
                    <span class="text-xs font-normal text-slate-400">Strictly women's items</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 shadow-xl sticky bottom-0 z-50">
        <div class="max-w-xl mx-auto px-4 flex justify-between items-center">
            <button onclick="window.location.href='index.html'" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition-all">
                ◀ Back
            </button>
            <button onclick="window.location.href='page3.html'" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all">
                Next ▶
            </button>
        </div>
    </footer>

    <script>
        const activeSlot = localStorage.getItem('luku_active_tester_slot') || "1";
        document.getElementById('testerIdBadge').innerText = activeSlot;

        // Visual tracking indicator updates
        let currentGender = localStorage.getItem(`luku_gender_pref_${activeSlot}`) || "All";
        highlightActiveOption(currentGender);

        function saveGender(gender) {
            localStorage.setItem(`luku_gender_pref_${activeSlot}`, gender);
            highlightActiveOption(gender);
            setTimeout(() => { window.location.href = 'page3.html'; }, 200);
        }

        function highlightActiveOption(gender) {
            ['All', 'Male', 'Female'].forEach(g => {
                const el = document.getElementById(`genderOpt${g}`);
                if (g === gender) {
                    el.className = "w-full border-2 border-indigo-600 bg-indigo-50/50 p-4 rounded-xl text-left font-bold text-indigo-900 transition-all flex justify-between items-center";
                } else {
                    el.className = "w-full border-slate-200 bg-white border-2 p-4 rounded-xl text-left font-bold transition-all flex justify-between items-center hover:bg-slate-50";
                }
            });
        }
    </script>
</body>
</html>
